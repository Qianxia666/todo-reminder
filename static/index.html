<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>任务提醒</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="dashboard-page">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/" aria-label="任务提醒首页">
                <span class="brand-mark" aria-hidden="true">T</span>
                <span class="brand-name">任务提醒</span>
            </a>
            <nav class="main-nav" aria-label="主导航">
                <a class="nav-link active" href="/" aria-current="page">任务管理</a>
                <a class="nav-link" href="/tasks">时间线</a>
            </nav>
        </div>
    </header>

    <div class="app-shell">
        <header class="page-heading">
            <div>
                <p class="page-kicker">工作台</p>
                <h1>任务与提醒</h1>
            </div>
            <p class="page-context">北京时间 · 飞书通知</p>
        </header>

        <section class="overview-grid" aria-label="任务概览">
            <article class="overview-item">
                <span class="overview-label">全部任务</span>
                <strong class="overview-value" id="metric-total-tasks">0</strong>
            </article>
            <article class="overview-item">
                <span class="overview-label">待开始</span>
                <strong class="overview-value" id="metric-pending-start">0</strong>
            </article>
            <article class="overview-item">
                <span class="overview-label">待截止</span>
                <strong class="overview-value" id="metric-pending-end">0</strong>
            </article>
            <article class="overview-item overview-notification">
                <span class="overview-label">飞书通知</span>
                <strong class="overview-value overview-state" id="metric-webhook-state">未配置</strong>
                <span class="overview-meta" id="metric-daily-time">每日提醒时间：09:00</span>
            </article>
        </section>

        <main class="dashboard-main">
            <section id="task-panel" class="workspace-section task-editor">
                <div class="section-head">
                    <div>
                        <p class="section-kicker">任务</p>
                        <h2>新建任务</h2>
                    </div>
                    <span class="section-note">时间均按北京时间保存</span>
                </div>

                <form id="task-form">
                    <div class="form-grid task-basics">
                        <div class="field field-wide">
                            <label for="title">任务标题</label>
                            <input id="title" name="title" type="text" maxlength="200" placeholder="例如：准备周会资料" required />
                        </div>
                        <div class="field field-wide">
                            <label for="description">备注 <span class="optional">可选</span></label>
                            <textarea id="description" name="description" maxlength="2000" rows="3" placeholder="补充说明、链接或交付内容"></textarea>
                        </div>
                    </div>

                    <div class="form-divider" role="presentation"></div>

                    <div class="schedule-grid">
                        <fieldset class="schedule-fieldset">
                            <legend>开始 <span>必填</span></legend>
                            <div class="segmented-control" role="radiogroup" aria-label="开始时间模式">
                                <label class="segment-option">
                                    <input type="radio" name="start-mode" value="minute" checked />
                                    <span>具体时间</span>
                                </label>
                                <label class="segment-option">
                                    <input type="radio" name="start-mode" value="day" />
                                    <span>全天</span>
                                </label>
                            </div>
                            <div class="input-stack" id="start-datetime-field">
                                <label class="sr-only" for="start-datetime">开始日期与时间</label>
                                <input id="start-datetime" type="datetime-local" />
                            </div>
                            <div class="input-stack hidden" id="start-date-field">
                                <label class="sr-only" for="start-date">开始日期</label>
                                <input id="start-date" type="date" />
                            </div>
                        </fieldset>

                        <fieldset class="schedule-fieldset">
                            <legend>截止 <span>可选</span></legend>
                            <div id="end-fields" class="end-field-stack">
                                <div class="segmented-control" role="radiogroup" aria-label="结束时间模式">
                                    <label class="segment-option">
                                        <input type="radio" name="end-mode" value="minute" checked />
                                        <span>具体时间</span>
                                    </label>
                                    <label class="segment-option">
                                        <input type="radio" name="end-mode" value="day" />
                                        <span>全天</span>
                                    </label>
                                </div>
                                <div class="input-stack" id="end-datetime-field">
                                    <label class="sr-only" for="end-datetime">截止日期与时间</label>
                                    <input id="end-datetime" type="datetime-local" />
                                </div>
                                <div class="input-stack hidden" id="end-date-field">
                                    <label class="sr-only" for="end-date">截止日期</label>
                                    <input id="end-date" type="date" />
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <label class="toggle-row" for="daily-reminder">
                        <span class="toggle-copy">
                            <span class="toggle-title">每日提醒</span>
                            <span class="toggle-note">在任务有效期内，每天按设置时间推送</span>
                        </span>
                        <input type="checkbox" id="daily-reminder" />
                        <span class="toggle-control" aria-hidden="true"></span>
                    </label>

                    <div class="form-actions">
                        <div class="button-group">
                            <button class="primary" type="submit" id="submit-task">保存任务</button>
                            <button class="secondary hidden" type="button" id="cancel-edit">取消编辑</button>
                        </div>
                        <span id="task-status" class="status-line hidden" role="status" aria-live="polite"></span>
                    </div>
                </form>
            </section>

            <aside id="settings-panel" class="workspace-section settings-panel">
                <div class="section-head compact">
                    <div>
                        <p class="section-kicker">通知</p>
                        <h2>提醒设置</h2>
                    </div>
                </div>
                <form id="settings-form">
                    <div class="field">
                        <label for="webhook">飞书 Webhook</label>
                        <input id="webhook" type="url" maxlength="500" placeholder="https://open.feishu.cn/..." />
                        <small class="input-hint">留空时暂停所有飞书推送</small>
                    </div>
                    <div class="settings-pair">
                        <div class="field">
                            <label for="deadline-minutes">提前提醒</label>
                            <div class="input-with-suffix">
                                <input id="deadline-minutes" type="number" min="1" max="10080" required />
                                <span>分钟</span>
                            </div>
                        </div>
                        <div class="field">
                            <label for="daily-reminder-time">每日时间</label>
                            <input id="daily-reminder-time" type="time" required />
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button class="primary" type="submit" id="save-settings">保存设置</button>
                        <button class="secondary" type="button" id="test-webhook">测试推送</button>
                    </div>
                    <span id="settings-status" class="status-line hidden" role="status" aria-live="polite"></span>
                </form>
            </aside>

            <section id="list-panel" class="workspace-section task-list-section">
                <div class="section-head list-head">
                    <div>
                        <p class="section-kicker">当前</p>
                        <h2>任务列表</h2>
                    </div>
                    <a class="text-link" href="/tasks">时间线视图 <span aria-hidden="true">→</span></a>
                </div>
                <div class="table-wrapper">
                    <table class="task-table">
                        <caption class="sr-only">当前任务提醒列表</caption>
                        <thead>
                            <tr>
                                <th scope="col">任务</th>
                                <th scope="col">开始</th>
                                <th scope="col">截止</th>
                                <th scope="col">推送状态</th>
                                <th scope="col">频率</th>
                                <th scope="col"><span class="sr-only">操作</span></th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body">
                            <tr class="empty-row"><td colspan="6">暂无任务</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js" type="module"></script>
</body>
</html>
